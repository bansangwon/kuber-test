apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-web
  namespace: bsw

spec:
  replicas: 2

  selector:
    matchLabels:
      app: my-web

  template:
    metadata:
      labels:
        app: my-web

    spec:
      containers:
        - name: my-web
          image: bansangwon/my-web:v1
          ports:
            - containerPort: 80
